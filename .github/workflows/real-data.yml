name: Tests + real NASA data

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -r requirements-dev.txt pillow
      - name: Unit tests (synthetic SPHEREx data)
        run: pytest -q
      - name: End-to-end on live NASA/IPAC IRSA SPHEREx data
        run: python scripts/real_data_check.py real-data-out
      - name: Upload animations and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spherex-real-data
          path: real-data-out
